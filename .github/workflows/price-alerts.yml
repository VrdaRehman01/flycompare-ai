name: Price alerts

# Free hosting puts the API to sleep when idle, which pauses its in-process alert checker.
# This schedule wakes it and asks it to check every due price alert.
# Needs repository secrets ALERTS_API_URL (e.g. https://flycompare-api.onrender.com) and
# ALERTS_CRON_TOKEN (the same value as on the server). Scheduled runs use the default branch.

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check due price alerts
        env:
          API_URL: ${{ secrets.ALERTS_API_URL }}
          TOKEN: ${{ secrets.ALERTS_CRON_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$TOKEN" ]; then
            echo "ALERTS_API_URL or ALERTS_CRON_TOKEN is not set; nothing to do."
            exit 0
          fi
          # A sleeping free instance can take about a minute to wake: allow for it and retry.
          curl --fail-with-body --silent --show-error --max-time 120 \
               --retry 3 --retry-delay 20 --retry-all-errors \
               -X POST "$API_URL/api/internal/alerts/run" \
               -H "Authorization: Bearer $TOKEN"
