
name: ML Dataset and Model Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  update-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/requirements.txt

      - name: Find previous successful ML run
        id: previous-run
        uses: actions/github-script@v7
        with:
          script: |
            const currentRunId = context.runId;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ml-pipeline.yml",
                status: "success",
                per_page: 100
              }
            );

            for (const run of runs) {
              if (run.id === currentRunId) continue;

              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100
                }
              );

              const artifact = artifacts.find(
                item =>
                  item.name === "flycompare-ml-results" &&
                  !item.expired
              );

              if (artifact) {
                core.setOutput("run_id", String(run.id));
                core.info(`Found previous ML artifact in run ${run.id}`);
                return;
              }
            }

            core.setOutput("run_id", "");
            core.info("No previous ML artifact found; first-run path applies.");

      - name: Download previous ML artifact
        if: steps.previous-run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: flycompare-ml-results
          path: previous-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous-run.outputs.run_id }}

      - name: Report previous artifact status
        shell: bash
        env:
          PREVIOUS_RUN_ID: ${{ steps.previous-run.outputs.run_id }}
        run: |
          if [ -n "$PREVIOUS_RUN_ID" ]; then
            echo "Downloaded artifact from run $PREVIOUS_RUN_ID"
            find previous-model -maxdepth 3 -type f -print
          else
            echo "No previous artifact available."
            echo "The pipeline will continue without an incumbent model."
          fi

      - name: Update fare dataset
        run: python ml/update_fare_dataset.py

      - name: Validate fare dataset
        run: python ml/data/validate_dataset.py

      - name: Evaluate and train model
        run: python ml/train_safe_log_ridge_model.py

      - name: Test fare predictions
        run: python ml/predict_fare.py

      - name: Upload model and evaluation report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flycompare-ml-results
          path: |
            ml/models/fare_log_ridge_model.joblib
            ml/models/latest_evaluation.json
          if-no-files-found: error
          retention-days: 14
